services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - ${BOT_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DB_PATH: /app/data/sessions.sqlite
      WABLAS_API_KEY: ${WABLAS_API_KEY:?Isi WABLAS_API_KEY di .env}
      WABLAS_SECRET_KEY: ${WABLAS_SECRET_KEY:?Isi WABLAS_SECRET_KEY di .env}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BOT_PORT:-3000}:3000"
    volumes:
      - bot-data:/app/data
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  bot-data:
