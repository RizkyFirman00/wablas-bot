services:
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      BOT_DOMAIN: ${BOT_DOMAIN:?Isi BOT_DOMAIN di .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      bot:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
